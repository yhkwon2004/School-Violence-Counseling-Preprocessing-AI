<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-label="합성 증거 006 · 사건 타임라인 보드">
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#062d62" flood-opacity=".14"/>
    </filter>
    <style>
      .bg{fill:#f6f9fd}
      .card{fill:url(#paper);stroke:#dbe6f3;filter:url(#shadow)}
      .navy{fill:#062d62}
      .gold{fill:#c8a66a}
      .muted{fill:#6d7e95}
      .line{stroke:#9fb1c7;stroke-width:2}
      .strong{font:700 30px "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
      .body{font:500 22px "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
      .small{font:500 17px "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
      .mono{font:600 19px Consolas,"Malgun Gothic",monospace}
    </style>
  </defs>
  <rect class="bg" width="1000" height="720"/>
  <rect class="card" x="34" y="30" width="932" height="660" rx="30"/>
  <text class="strong navy" x="68" y="82">합성 증거 006 · 사건 타임라인 보드</text>
  
  <text class="small muted" x="68" y="118">상담 전처리 요약용 보드 · 판단 문구 없음</text>
  <circle cx="128" cy="158" r="14" fill="#c8a66a"/>
  <line x1="128" x2="128" y1="172" y2="228" stroke="#ccd8e6" stroke-width="3"/>
  <text class="mono navy" x="164" y="166">14:20</text>
  <text class="small muted" x="260" y="166">2층 복도</text>
  <text class="body navy" x="430" y="166">B의 모욕성 발언 주장</text>
  <circle cx="128" cy="242" r="14" fill="#d95454"/>
  <line x1="128" x2="128" y1="256" y2="312" stroke="#ccd8e6" stroke-width="3"/>
  <text class="mono navy" x="164" y="250">14:25</text>
  <text class="small muted" x="260" y="250">계단</text>
  <text class="body navy" x="430" y="250">B 접근, C 촬영 주장</text>
  <circle cx="128" cy="326" r="14" fill="#062d62"/>
  <line x1="128" x2="128" y1="340" y2="396" stroke="#ccd8e6" stroke-width="3"/>
  <text class="mono navy" x="164" y="334">14:30</text>
  <text class="small muted" x="260" y="334">단체 채팅방</text>
  <text class="body navy" x="430" y="334">영상 공유와 읽음 인원 발생</text>
  <circle cx="128" cy="410" r="14" fill="#2f8f75"/>
  <line x1="128" x2="128" y1="424" y2="480" stroke="#ccd8e6" stroke-width="3"/>
  <text class="mono navy" x="164" y="418">14:36</text>
  <text class="small muted" x="260" y="418">교실</text>
  <text class="body navy" x="430" y="418">친구 A에게 상황 전달</text>
  <circle cx="128" cy="494" r="14" fill="#8ca0b6"/>
  <line x1="128" x2="128" y1="508" y2="564" stroke="#ccd8e6" stroke-width="3"/>
  <text class="mono navy" x="164" y="502">15:10</text>
  <text class="small muted" x="260" y="502">복도/상담실</text>
  <text class="body navy" x="430" y="502">목격자 D 진술 후보와 교사 보고</text>
  <rect x="92" y="600" width="816" height="42" rx="21" fill="#fff7e5"/>
  <text class="small navy" x="126" y="628">확인 필요: CCTV 보존 여부, 목격자 D의 정확 위치, 원본 영상 보유자</text>
  
</svg>
