project_id = "ieumlog-school-safety"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "ieumlog://**"]
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

[analytics]
enabled = false

[functions.student-login]
verify_jwt = false

[functions.purge-deleted]
verify_jwt = false

[functions.retry-failed-jobs]
verify_jwt = false
