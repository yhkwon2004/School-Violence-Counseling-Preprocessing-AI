name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:deploy
      - run: npx expo-doctor
        working-directory: apps/mobile
      - run: npx expo export --platform android
        working-directory: apps/mobile
